# Ai Engineering Harness Workflow Add Or Fix Markdown Structure Ci Gate

## Action

Follow the add-or-fix-markdown-structure-ci-gate workflow:
1. Create or update a shell script (e.g., scripts/check-templates.sh) to check for fence parity, heading levels inside fences, and invisible count markers.
2. Add or update bats tests to cover new rules or edge cases.
3. Integrate the script into CI (e.g., test.yml static job).
4. Test the script by running it on current and previous versions of the docs to ensure it catches real issues and avoids false positives.
5. Document the new checks and ensure contributors are aware of the gate.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: scripts/check-templates.sh, tests/check-templates.bats


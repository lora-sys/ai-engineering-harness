    <!-- Fonts. The design is typographic, so these are not optional -- but they
         must not block first paint. preconnect + display=swap means text renders
         in the fallback immediately and swaps, rather than sitting invisible
         (FOIT) while the network decides. Only the weights actually used are
         requested; pulling whole families is the usual reason a type-led page
         misses its LCP budget. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
